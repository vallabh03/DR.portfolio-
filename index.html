<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dr. Abhinav Thaduri</title>
    <meta name="description" content="Dr. Abhinav Thaduri — background, clinical experience, credentials, areas of care, research and consultation requests." />
    <meta name="author" content="Dr. Abhinav Thaduri" />
    <!-- TODO [VERIFY DOMAIN]: replace example.com with the real domain before launch -->
    <link rel="canonical" href="https://www.example.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dr. Abhinav Thaduri" />
    <meta property="og:title" content="Dr. Abhinav Thaduri" />
    <meta property="og:description" content="Experience, credentials, approach to care and consultation requests." />
    <meta property="og:url" content="https://www.example.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dr. Abhinav Thaduri" />
    <meta name="twitter:description" content="Experience, credentials, approach to care and consultation requests." />

    <meta name="theme-color" content="#f6f3ec" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Light is the default; apply a stored choice before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('at-theme')
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:2rem;font-family:sans-serif">
        <h1>Dr. Abhinav Thaduri</h1>
        <p>Please enable JavaScript to view this website.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
