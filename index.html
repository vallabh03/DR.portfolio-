<!doctype html>
<html lang="en-IN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- seo:start: title, description, canonical, social and robots tags and structured data, written per page by the build (scripts/seo-pages.ts) -->
    <title>Dr Abhinav Thaduri</title>
    <!-- seo:end -->

    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Light is the default; apply a stored choice before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('at-theme')
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>
      <!-- seo:noscript:start: a plain, crawlable version of the page's heading, summary and links, written per page by the build -->
      <div style="padding:2rem;font-family:sans-serif">
        <h1>Dr Abhinav Thaduri</h1>
        <p>Please enable JavaScript to view this website.</p>
      </div>
      <!-- seo:noscript:end -->
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
