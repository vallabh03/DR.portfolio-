name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR so older runs don't block newer ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the Node version from .nvmrc (currently "22").
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reproducible install from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # Type-check the browser bundle.
      - name: Type-check (client)
        run: npx tsc -b

      # Type-check the Vercel function and tests.
      - name: Type-check (server)
        run: npx tsc -p tsconfig.server.json

      # All 26 API unit tests must pass. No network or credentials needed.
      - name: Run tests
        run: npm test

      # The production build must succeed. No VITE_ secrets needed.
      - name: Build
        run: npm run build
        env:
          # Suppress Vite's default "open in browser" prompts.
          CI: true
